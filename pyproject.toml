[project]
name = "ila"
version = "0.1.0"
description = "Offline Intelligent Lecture Assistant - on-device captioning, notes, syllabus Q&A and adaptive quizzes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "typer>=0.12.5",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
ila = "ila.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ila"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
